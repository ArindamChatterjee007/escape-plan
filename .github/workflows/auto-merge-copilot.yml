name: Auto-merge finished Copilot PRs

# The owner is offline. When the cloud Copilot coding agent marks its PR "ready for review",
# merge it so GitHub Pages (docs/ on main) publishes the site without a human click.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge ready Copilot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list -R "$REPO" --state open --json number,isDraft,author,mergeable,headRefName \
                --jq '[.[] | select(.isDraft==false) | select((.author.login|ascii_downcase|test("copilot")) or (.headRefName|startswith("copilot/")))] | .[].number')
          if [ -z "$prs" ]; then echo "No ready Copilot PRs."; exit 0; fi
          for n in $prs; do
            echo "Merging PR #$n"
            gh pr merge "$n" -R "$REPO" --squash --delete-branch || echo "PR #$n not mergeable yet"
          done
          # Nudge a Pages build (pushes made with GITHUB_TOKEN may not trigger one automatically)
          gh api -X POST "repos/$REPO/pages/builds" >/dev/null 2>&1 || true
